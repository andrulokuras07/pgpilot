services:
  appdb_v2:
    image: postgres:16
    container_name: appdb_v2
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: foro_user
      POSTGRES_PASSWORD: foro_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5444:5432"          # puerto 5444 en el host (la v1 usaba 5434)
    volumes:
      # los scripts de init corren en orden alfabético en el primer arranque
      - ./init:/docker-entrypoint-initdb.d:ro
      # postgresql.conf con work_mem bajo intencional
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - appdb_v2_data:/var/lib/postgresql/data
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foro_user -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  appdb_v2_data:
    name: appdb_v2_data
