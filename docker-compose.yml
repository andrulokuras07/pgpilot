# HECHO CON CLAUDE

services:
  appdb:
    image: postgres:16
    container_name: appdb
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - ./infra/appdb/init:/docker-entrypoint-initdb.d:ro
      - ./infra/appdb/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - appdb_data:/var/lib/postgresql/data
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Sandbox usa Postgres 18 a propósito (AppDB se queda en 16):
  # B15 falsea stats con `pg_set_relation_stats`, función que existe sólo
  # desde PG18. Sin ella, el planner ignora `pg_class.reltuples/relpages`
  # cuando el archivo en disco está vacío (caso de las tablas sandbox) y
  # los costos colapsan a 0, dejando inútiles las validaciones de C3.
  sandbox:
    image: postgres:18
    container_name: sandbox
    restart: unless-stopped
    environment:
      POSTGRES_DB: sandbox
      POSTGRES_USER: sandbox_user
      POSTGRES_PASSWORD: sandbox_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5435:5432"
    volumes:
      - sandbox_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox_user -d sandbox"]
      interval: 10s
      timeout: 5s
      retries: 20

