# =====================================================================
# AppDB v2 — postgresql.conf
# Configuración intencional para el proyecto PgPilot (Demo Day)
# =====================================================================
# work_mem deliberadamente bajo: fuerza a que las agregaciones y
# ordenamientos grandes (Q05, Q13, Q18, etc.) derramen a disco, de modo
# que el anti-pattern "sort en disco" sea visible en EXPLAIN ANALYZE.
# =====================================================================

listen_addresses = '*'
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# --- el parámetro clave del demo ---
work_mem = 1MB                  # bajo a propósito (Q05 y otros derraman a disco)

# --- resto de parámetros razonables para una BD de ~800 MB ---
shared_buffers = 256MB
effective_cache_size = 1GB
max_connections = 100

# logging de queries lentas apagado (que el producto de los alumnos
# trabaje desde pg_stat_statements, no desde el log)
log_min_duration_statement = -1
