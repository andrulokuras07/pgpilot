# =====================================================================
# AppDB v1.0 — postgresql.conf
# Tuned for query analysis demo. Some params set intentionally low to
# trigger anti-patterns (e.g. low work_mem causing sorts to spill).
# =====================================================================

# Connection settings
listen_addresses = '*'
max_connections = 100
port = 5432

# Memory (work_mem intentionally low for Q05 to spill to disk)
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Statement tracking — required for PgPilot to analyze workload
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = 'top'
pg_stat_statements.track_utility = on

# Plan settings
random_page_cost = 4.0
effective_cache_size = 512MB

# WAL
wal_level = replica
checkpoint_completion_target = 0.9
wal_buffers = 4MB
max_wal_size = 1GB

# Logging — enabled so detector can show slow queries optionally
log_min_duration_statement = 5000
log_connections = off
log_disconnections = off
log_destination = 'stderr'

# Timezone
log_timezone = 'America/Mexico_City'
timezone = 'America/Mexico_City'

# Locale
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
